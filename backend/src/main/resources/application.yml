spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_interview?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  # 打印SQL到控制台，方便调试
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 自动驼峰转下划线：userName -> user_name
  global-config:
    db-config:
      table-prefix: ""

ai:
    service-url: http://localhost:8000

jwt:
  secret: my-secret-key-for-ai-interview-simulator-2025
  expiration: 1800000  # 30分钟（毫秒）
